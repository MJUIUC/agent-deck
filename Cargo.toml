[workspace]
members = [
    "server",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0"

[workspace.dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
async-openai = "0.26"
tokio-cron-scheduler = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
chrono-tz = { version = "0.10", features = ["serde"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
cookie = "0.18"
axum-extra = { version = "0.9", features = ["cookie"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
dashmap = "6"
dirs = "5"
tokio-util = { version = "0.7", features = ["rt", "io"] }
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
web-push = { version = "0.11.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
