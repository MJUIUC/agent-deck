name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-13
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build web application
        run: |
          cd web
          npm ci
          npm run build

      - name: Build server binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          ARCH="${{ matrix.arch }}"
          TARBALL="agent-deck-macos-${ARCH}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/server" dist/agent-deck
          cp -r web/dist dist/public
          cp install.sh dist/
          cp -r scripts dist/
          tar -czf "$TARBALL" -C dist .
          shasum -a 256 "$TARBALL" > "${TARBALL}.sha256"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-deck-macos-${{ matrix.arch }}.tar.gz
            agent-deck-macos-${{ matrix.arch }}.tar.gz.sha256
          generate_release_notes: true
